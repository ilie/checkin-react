<script>
  // Render every screen twice: light, then dark.
  const template = document.getElementById("screens");
  for (const theme of ["light", "dark"]) {
    const row = document.getElementById(theme);
    row.append(template.content.cloneNode(true));
    for (const frame of row.querySelectorAll(".frame")) {
      frame.id = `${frame.dataset.id}-${theme}`;
      if (theme === "dark") frame.classList.add("dark");
    }
  }
  // Home on an iPhone SE (375×667) and a Pro Max (440×956).
  const sizes = document.getElementById("sizes");
  for (const [name, w, h] of [["se", 375, 667], ["promax", 440, 956]]) {
    for (const id of ["home-in", "home-nudge"]) {
      const frame = document.getElementById(`${id}-light`).cloneNode(true);
      frame.id = `${id}-${name}`;
      frame.style.setProperty("--w", `${w}px`);
      frame.style.setProperty("--h", `${h}px`);
      if (h < 720) frame.classList.add("short");
      sizes.append(frame);
    }
  }
  lucide.createIcons();
</script>
